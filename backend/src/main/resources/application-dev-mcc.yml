# Local development against the mock-m-sso stack (compose.yml). Every value here is a mock.
spring:
  datasource:
    url: ${ANNUALVA_DB_URL:jdbc:postgresql://localhost:5432/annualva}
    username: ${ANNUALVA_DB_USERNAME:annualva}
    password: ${ANNUALVA_DB_PASSWORD:annualva-local}
  ssl:
    bundle:
      pem:
        mcc-trust:
          truststore:
            # Keycloak self-signed certificate from the sibling repo. The path is relative to backend/
            # when running ./mvnw spring-boot:run from there.
            certificate: file:../../mock-m-sso/keycloak/certs/mock-oidc.crt

server:
  ssl:
    enabled: true
    key-store: classpath:dev-keystore.p12
    key-store-type: PKCS12
    key-store-password: ${DEV_KEYSTORE_PASSWORD:changeit}
    key-alias: mcc-dev

annualva:
  mcc:
    # Explicit endpoints, never issuer-uri (discovery would bypass the SSL bundle). Wired by the sign-in slice.
    issuer: https://localhost:9080/realms/SSO
    authorization-uri: https://localhost:9080/realms/SSO/protocol/openid-connect/auth
    token-uri: https://localhost:9080/realms/SSO/protocol/openid-connect/token
    jwk-set-uri: https://localhost:9080/realms/SSO/protocol/openid-connect/certs
    user-info-uri: https://localhost:9080/realms/SSO/protocol/openid-connect/userinfo
    # Trusts the Keycloak certificate (spring.ssl.bundle.pem.mcc-trust above); opened on first use.
    ssl-bundle: mcc-trust
    login-client-id: app-appfw
    service-client-id: svc-appfw
    idp-hint: singpass
    signing-key:
      kid: mcc-dev-ec521
      # Generated by scripts/gen-dev-keys.sh (base64 PKCS#8 / SPKI). Mock values for the local stack only.
      private: ${ANNUALVA_MCC_SIGNING_PRIVATE:}
      public: ${ANNUALVA_MCC_SIGNING_PUBLIC:}
  sign-in:
    # MockPass through Keycloak does not assert amr/acr the way MCC SSO does; the check stays on in ci and in
    # every deployed profile. Disabling it here is logged at startup.
    require-mfa-claim: false
  aws:
    endpoint: http://localhost:4566
    region: us-east-1
    quarantine-bucket: annualva-quarantine-dev
    clean-bucket: annualva-clean-dev
    kms-key-alias: alias/annualva-dev
  sfs:
    base-url: http://localhost:9083
  mcns:
    base-url: http://localhost:9082
  # Mock template ids: mock-MCNS logs whatever it is sent (README, Simulating the mocks).
  mail:
    app-url: https://localhost:8443
    templates:
      returned-for-rework: dev-returned-for-rework
      overdue: dev-overdue
      register-change: dev-register-change
      reminder-due-soon: dev-reminder-due-soon
      reminder-due: dev-reminder-due
      overdue-weekly: dev-overdue-weekly
      reminder-copy: dev-reminder-copy
  dev:
    # MockPass personas carry a uuid but no email; the System Register works by email.
    identities:
      11111111-0000-4000-8000-000000000001: smo.a@dev.annualva.test
      11111111-0000-4000-8000-000000000002: smo.b@dev.annualva.test
      11111111-0000-4000-8000-000000000003: cm.a@dev.annualva.test
      11111111-0000-4000-8000-000000000004: cm.b@dev.annualva.test
      11111111-0000-4000-8000-000000000005: poc.1@dev.annualva.test
      11111111-0000-4000-8000-000000000006: poc.2@dev.annualva.test
  # Exactly two, the VA POC personas; the role store grants them VA_POC at startup.
  va-pocs: poc.1@dev.annualva.test,poc.2@dev.annualva.test
