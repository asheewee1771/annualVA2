# Base configuration: the production shape. Environment-specific or secret values appear only as
# ${ENV_VAR} bindings; literals here are the same in every environment. Profiles layer on top:
#   dev-mcc  local development against ../mock-m-sso + LocalStack + compose PostgreSQL
#   ci       Seam 1 tests (src/test/resources/application-ci.yml; Testcontainers + in-process fakes)
#   sit      first deployed target (application-sit.yml: ${VAR:dev-default}; optional backend/.env.sit)
spring:
  application:
    name: annualva
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ANNUALVA_DB_URL}
    username: ${ANNUALVA_DB_USERNAME}
    password: ${ANNUALVA_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      # Flyway owns the schema (V3__spring_session.sql).
      initialize-schema: never
  servlet:
    multipart:
      # Container ceiling. Each report type has its own, lower limit in the upload pipeline (as-1).
      max-file-size: 50MB
      max-request-size: 52MB

server:
  port: 8443
  forward-headers-strategy: framework
  servlet:
    session:
      # as-11 wall-clock backstop in the session store: keep equal to annualva.sign-in.idle-timeout, which the
      # access module enforces by the application clock together with the absolute limit.
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    # as-13: nothing about the failure in an error body beyond RFC 9457 title/status and the traceId.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    include-path: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    # lm-15: one ECS JSON schema for application and audit logs.
    format:
      console: ecs
    ecs:
      service:
        name: annualva

annualva:
  # Business calendar for VA Cycle, Quarter and Window arithmetic (timestamps are stored in UTC).
  time-zone: Asia/Singapore
  # IM8 dp-8 banner shown on every screen (assumption A-1: single report Restricted / Sensitive-Normal).
  classification:
    banner: RESTRICTED / SENSITIVE-NORMAL
  # Story 16: VA Cycle 2027 goes live at Q3 (Monday 2 August 2027); earlier Quarters of that Cycle, and every earlier
  # Cycle, are Handled outside the app. A one-off setting, the same in every environment.
  calendar:
    first-live-cycle: 2027
    first-live-quarter: 3
  scheduling:
    enabled: true
  # IM8 ac-1, story 75: exactly two VA POC email addresses (comma-separated), set at deployment and changed only
  # through its change request. The application refuses to start with fewer or more; roles are synced at startup.
  va-pocs: ${ANNUALVA_VA_POCS}
  # Email through the organisation's mail relay (stories 91 and 94, ADR 0044). The app's address starts every mailed
  # link; each logical template is sent as the relay's onboarded template id (ticket 57). The application refuses to
  # start without either. A failed hand-over is tried again after 1, 2, 4 and 8 minutes, five attempts in all.
  mail:
    app-url: ${ANNUALVA_APP_URL}
    templates:
      returned-for-rework: ${ANNUALVA_MAIL_TEMPLATE_RETURNED_FOR_REWORK}
      overdue: ${ANNUALVA_MAIL_TEMPLATE_OVERDUE}
      register-change: ${ANNUALVA_MAIL_TEMPLATE_REGISTER_CHANGE}
  # MCC SSO: explicit endpoints (never issuer-uri discovery), private_key_jwt with the EC P-521 key below.
  mcc:
    issuer: ${ANNUALVA_MCC_ISSUER}
    authorization-uri: ${ANNUALVA_MCC_AUTHORIZATION_URI}
    token-uri: ${ANNUALVA_MCC_TOKEN_URI}
    jwk-set-uri: ${ANNUALVA_MCC_JWK_SET_URI}
    user-info-uri: ${ANNUALVA_MCC_USER_INFO_URI}
    # Outbound calls to MCC SSO (token endpoint, JWKS): a stalled provider must not hold request threads.
    connect-timeout: 3s
    read-timeout: 10s
    login-client-id: ${ANNUALVA_MCC_LOGIN_CLIENT_ID}
    idp-hint: ${ANNUALVA_MCC_IDP_HINT}
    signing-key:
      kid: ${ANNUALVA_MCC_SIGNING_KID}
      private: ${ANNUALVA_MCC_SIGNING_PRIVATE}
      public: ${ANNUALVA_MCC_SIGNING_PUBLIC}
  sign-in:
    # ac-2: a token without multi-factor evidence (amr or acr) is refused. Set per environment from what the
    # identity provider emits (SSO onboarding ticket); disabling it is logged at startup, never silent.
    require-mfa-claim: true
    # The email links a person to Register roles: a token whose email is not asserted verified is refused.
    # Set per environment from what the provider emits (SSO onboarding ticket); disabling it is logged.
    require-verified-email: true
    mfa-amr-values: mfa,otp,hwk
    # as-11 (ADR 0008): 30 minutes idle, 8 hours at most, by the application clock.
    idle-timeout: 30m
    absolute-timeout: 8h
    # as-4: sessions one client address may start per minute without being signed in; each is a store row.
    anonymous-sessions-per-minute: 60
  # ac-2, story 77, ADR 0004: a sensitive action needs a sign-in within the freshness window.
  step-up:
    freshness-window: 5m
    # How far before the step-up started the provider's auth_time may fall (the two clocks differ a little).
    clock-skew: 30s
    # prompt-login: ask MCC SSO for a fresh sign-in (prompt=login, max_age=0). full-sign-in: for an MCC SSO that
    # ignores them (verified at SIT), end the session and make the person sign in from the start.
    mode: prompt-login
