# Seam 1 test profile (test classpath only). The database comes from Testcontainers through
# @ServiceConnection, which overrides the datasource values below; the boundary adapters are the
# in-process fakes in sg.annualva.harness. The MCC SSO endpoints and the signing key come from the
# fake OIDC issuer through @DynamicPropertySource in Seam1Test.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/overridden-by-testcontainers
    username: ci
    password: ci

server:
  ssl:
    enabled: false
  servlet:
    session:
      cookie:
        secure: false

annualva:
  scheduling:
    enabled: false
  scan:
    # Short, so the tests that time a scan out finish quickly. A Scan Report attempt is timed by the controllable clock
    # (a test moves it past two minutes); the Register upload waits in real time, a few polls of a few milliseconds.
    attempt-timeout: 2m
    sync-wait: 200ms
    sync-poll-interval: 20ms
  # Two VA POCs for the role store; the tests sign in as them.
  va-pocs: poc.one@ci.annualva.test,poc.two@ci.annualva.test
  # The capturing mail relay records these ids; the mail tests assert them (MailSeam1).
  mail:
    app-url: https://annualva.ci.test
    templates:
      returned-for-rework: ci-returned-for-rework
      overdue: ci-overdue
      register-change: ci-register-change
  mcc:
    login-client-id: app-appfw
    # Short, so the stalled-provider tests finish quickly; the fake answers normally in milliseconds.
    read-timeout: 2s
    idp-hint: singpass
  sign-in:
    require-mfa-claim: true
    # Every test shares one client address; a dedicated test lowers this.
    anonymous-sessions-per-minute: 100000
    # One acr level the fake issuer can assert instead of amr, to prove the acr path.
    mfa-acr-values: urn:annualva:ci:mfa
  dev:
    # A persona that carries no email claim, resolved like a MockPass persona under dev-mcc.
    identities:
      "[11111111-0000-4000-8000-000000000099]": persona.no-email@ci.annualva.test
